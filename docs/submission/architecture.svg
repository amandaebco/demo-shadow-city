<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="80" y="92" font-size="52" font-weight="700" fill="#14213D">Shadow City on Google Cloud</text>
  <text x="80" y="138" font-size="26" fill="#4A5568">Gemini decides and explains · a deterministic engine computes · every decision is logged</text>

  <!-- Region bands -->
  <rect x="300" y="190" width="1250" height="840" rx="20" fill="none" stroke="#C9D1DC" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="320" y="224" font-size="22" fill="#6B7785">ebc-cloud-dev-03 · asia-southeast2 (Jakarta)</text>
  <rect x="1580" y="610" width="300" height="250" rx="20" fill="none" stroke="#C9D1DC" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1600" y="644" font-size="22" fill="#6B7785">asia-southeast1 (Singapore)</text>

  <!-- Planner -->
  <rect x="60" y="430" width="200" height="120" rx="16" fill="#14213D"/>
  <text x="160" y="482" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Planner</text>
  <text x="160" y="518" font-size="22" fill="#C9D6F0" text-anchor="middle">browser</text>

  <!-- Frontend -->
  <rect x="340" y="400" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#F9AB00" stroke-width="3"/>
  <text x="490" y="446" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">Frontend</text>
  <text x="490" y="482" font-size="22" fill="#4A5568" text-anchor="middle">Firebase Hosting · Next.js</text>
  <text x="490" y="514" font-size="22" fill="#4A5568" text-anchor="middle">live map · decision panel</text>
  <text x="490" y="546" font-size="22" fill="#4A5568" text-anchor="middle">report · verification</text>

  <!-- Orchestrator -->
  <rect x="740" y="250" width="360" height="230" rx="16" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <text x="920" y="296" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">Orchestrator</text>
  <text x="920" y="330" font-size="22" fill="#4A5568" text-anchor="middle">Cloud Run · FastAPI</text>
  <text x="920" y="368" font-size="22" fill="#4A5568" text-anchor="middle">scenarios · population + clusters</text>
  <text x="920" y="400" font-size="22" fill="#4A5568" text-anchor="middle">baseline comparison</text>
  <text x="920" y="432" font-size="22" fill="#4A5568" text-anchor="middle">analyst · verifier · backtest</text>

  <!-- Gemini -->
  <rect x="1200" y="250" width="320" height="230" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
  <text x="1360" y="300" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">Gemini</text>
  <text x="1360" y="334" font-size="22" fill="#4A5568" text-anchor="middle">Vertex AI</text>
  <text x="1360" y="376" font-size="22" fill="#1A73E8" text-anchor="middle" font-weight="700">System Two</text>
  <text x="1360" y="410" font-size="22" fill="#4A5568" text-anchor="middle">personas · reports · audit</text>
  <text x="1360" y="442" font-size="22" fill="#4A5568" text-anchor="middle">decisions (until distilled)</text>

  <!-- Pub/Sub -->
  <rect x="740" y="560" width="360" height="110" rx="16" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
  <text x="920" y="604" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle">Pub/Sub</text>
  <text x="920" y="640" font-size="22" fill="#4A5568" text-anchor="middle">scenario-start · completed</text>

  <!-- Simulation worker -->
  <rect x="740" y="750" width="360" height="200" rx="16" fill="#FFFFFF" stroke="#34A853" stroke-width="3"/>
  <text x="920" y="796" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">Simulation worker</text>
  <text x="920" y="830" font-size="22" fill="#4A5568" text-anchor="middle">deterministic engine</text>
  <text x="920" y="864" font-size="22" fill="#4A5568" text-anchor="middle">OSM roads · rail stations · floods</text>
  <text x="920" y="898" font-size="22" fill="#4A5568" text-anchor="middle">5-minute ticks · fixed seed</text>
  <text x="920" y="930" font-size="22" fill="#4A5568" text-anchor="middle">one decision per cluster</text>

  <!-- System One -->
  <rect x="1200" y="750" width="320" height="200" rx="16" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <text x="1360" y="796" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">System One</text>
  <text x="1360" y="830" font-size="22" fill="#4A5568" text-anchor="middle">Cloud Run · /v1/decide</text>
  <text x="1360" y="864" font-size="22" fill="#4A5568" text-anchor="middle">structured output</text>
  <text x="1360" y="898" font-size="22" fill="#4A5568" text-anchor="middle">decision cache · replay</text>
  <text x="1360" y="930" font-size="22" fill="#4A5568" text-anchor="middle">seeded sampling</text>

  <!-- Gemma -->
  <rect x="1610" y="680" width="240" height="160" rx="16" fill="#E6F4EA" stroke="#34A853" stroke-width="3"/>
  <text x="1730" y="724" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">Gemma 4</text>
  <text x="1730" y="760" font-size="22" fill="#4A5568" text-anchor="middle">Cloud Run · L4 GPU</text>
  <text x="1730" y="794" font-size="22" fill="#34A853" text-anchor="middle" font-weight="700">System One</text>
  <text x="1730" y="824" font-size="22" fill="#4A5568" text-anchor="middle">distillation target</text>

  <!-- Firestore -->
  <rect x="340" y="700" width="300" height="160" rx="16" fill="#FFF7E0" stroke="#F9AB00" stroke-width="3"/>
  <text x="490" y="746" font-size="28" font-weight="700" fill="#14213D" text-anchor="middle">Firestore</text>
  <text x="490" y="782" font-size="22" fill="#4A5568" text-anchor="middle">scenarios · ticks · metrics</text>
  <text x="490" y="814" font-size="22" fill="#4A5568" text-anchor="middle">personas · decisions</text>
  <text x="490" y="844" font-size="22" fill="#4A5568" text-anchor="middle">reports · cache</text>

  <!-- BigQuery -->
  <rect x="1610" y="880" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
  <text x="1730" y="926" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle">BigQuery</text>
  <text x="1730" y="962" font-size="22" fill="#4A5568" text-anchor="middle">decision log</text>
  <text x="1730" y="990" font-size="18" fill="#6B7785" text-anchor="middle">asia-southeast2</text>

  <!-- Arrows -->
  <line x1="260" y1="490" x2="334" y2="490" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M640 450 L700 450 L700 365 L734 365" fill="none" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="652" y="432" font-size="20" fill="#6B7785">/v1</text>
  <line x1="1100" y1="365" x2="1194" y2="365" stroke="#1A73E8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="920" y1="480" x2="920" y2="554" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="670" x2="920" y2="744" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1100" y1="850" x2="1194" y2="850" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1360 750 L1360 486" fill="none" stroke="#1A73E8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="1520" y1="790" x2="1604" y2="770" stroke="#34A853" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <line x1="1520" y1="900" x2="1604" y2="935" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 850 L646 820" fill="none" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="770" y1="480" x2="618" y2="694" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="704" y="560" font-size="20" fill="#6B7785" text-anchor="end">writes</text>
  <line x1="490" y1="700" x2="490" y2="586" stroke="#F9AB00" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="502" y="652" font-size="20" fill="#6B7785">live ticks</text>
  <path d="M1730 880 L1730 846" fill="none" stroke="#34A853" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="1746" y="870" font-size="18" fill="#34A853">teacher data</text>

  <!-- Footer -->
  <text x="80" y="1062" font-size="20" fill="#6B7785">CI: Cloud Build (company project) · all services private except the orchestrator and hosting · dashed = Gemma path (live, demo uses Gemini)</text>
</svg>
