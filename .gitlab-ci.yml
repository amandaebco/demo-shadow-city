# Shadow City CI: runs each service's tests on merge requests and on main.
# Each track adds jobs for its own services; jobs only run when their files change.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test

.python-service-tests:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  before_script:
    - cd "services/$SERVICE"
    - pip install -q -r requirements-dev.txt
  script:
    - python -m pytest -q

# Track A
test:system-one:
  extends: .python-service-tests
  variables:
    SERVICE: system-one
  rules:
    - changes:
        - services/system-one/**/*
        - .gitlab-ci.yml

test:orchestrator:
  extends: .python-service-tests
  variables:
    SERVICE: orchestrator
  rules:
    - changes:
        - services/orchestrator/**/*
        - .gitlab-ci.yml

